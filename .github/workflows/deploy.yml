name: Deploy Diapsa Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.SERVER_HOST }}
            username: ${{ secrets.SERVER_USER }}
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
                set -e

                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

                nvm use 24

                cd ${{ secrets.APP_PATH }}

                # npm install reescribe package-lock.json en el servidor y
                # después git pull se niega a pisarlo. El lock bueno es el
                # del repositorio: se descarta el local antes de traer código.
                echo "Pulling latest code"
                git checkout -- package-lock.json || true
                git pull origin main

                echo "Installing dependencies"
                npm install

                echo "Building Next.js"
                rm -rf .next
                npm run build

                echo "Reloading PM2"
                pm2 reload ecosystem.config.js --update-env

                # El hosting (cPanel) pone un caché de NGINX delante de Node y
                # respeta el s-maxage de un año que Next manda en las páginas
                # estáticas. Sin esto, tras un deploy las URLs ya visitadas
                # siguen sirviendo el HTML viejo. Si uapi no existe, avisa y
                # no tumba el deploy.
                echo "Clearing NGINX cache (cPanel)"
                uapi --output=jsonpretty NginxCaching clear_cache || echo "uapi no disponible: limpiar el cache de NGINX a mano en cPanel"

# Pendientes
# cache de node_modules
# staging branch
# rollback automático
# healthcheck post-deploy