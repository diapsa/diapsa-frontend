<script>
function montarEscena(THREE, container, opciones) {
  opciones = opciones || {};
  var MODOS = ['aviso', 'informe', 'idap'];
  var modoActual = MODOS.indexOf(opciones.modo) >= 0 ? opciones.modo : 'aviso';
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var quieto = function () { return !!(mq && mq.matches); };
  var recursos = [];
  var track = function (x) { recursos.push(x); return x; };

  // ---------- utilidades ----------
  var clamp = function (x) { return x < 0 ? 0 : x > 1 ? 1 : x; };
  var prog = function (t, a, d) { return clamp((t - a) / d); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  var eo = function (k) { return 1 - Math.pow(1 - k, 3); };
  var ei = function (k) { return k * k * k; };
  var eio = function (k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
  var eob = function (k, s) { s = s == null ? 1.4 : s; var c = s + 1; return 1 + c * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };

  function rrShape(w, h, r) {
    var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0, false);
    s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2, false);
    s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
    s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
    return s;
  }
  function roundedBox(w, h, d, r, b) {
    var g = new THREE.ExtrudeGeometry(rrShape(w - 2 * b, h - 2 * b, Math.max(r - b, 0.001)), {
      depth: Math.max(d - 2 * b, 0.0005), bevelEnabled: true, bevelThickness: b, bevelSize: b,
      bevelSegments: 4, curveSegments: 12
    });
    g.translate(0, 0, -(d - 2 * b) / 2);
    return track(g);
  }
  function roundedPlane(w, h, r) {
    var g = new THREE.ShapeGeometry(rrShape(w, h, r), 12);
    var p = g.attributes.position, uv = g.attributes.uv;
    for (var i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h);
    uv.needsUpdate = true;
    return track(g);
  }
  function tex(canvas) {
    var t = new THREE.CanvasTexture(canvas);
    if ('colorSpace' in t && THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
    else if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return track(t);
  }
  function lienzo(w, h, fn) { var c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return tex(c); }
  function radial(stops) {
    return lienzo(256, 256, function (x) {
      var g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
      stops.forEach(function (s) { g.addColorStop(s[0], s[1]); });
      x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    });
  }
  function mat(nombre, props, lista) {
    var m = track(new THREE.MeshStandardMaterial(props)); m.name = nombre; m.transparent = true;
    if (lista) lista.push({ m: m, base: 1 });
    return m;
  }
  function malla(nombre, g, m) { var o = new THREE.Mesh(g, m); o.name = nombre; return o; }
  var semilla = 7;
  var azar = function () { semilla = (semilla * 16807) % 2147483647; return semilla / 2147483647; };

  // ---------- DOM ----------
  if (getComputedStyle(container).position === 'static') container.style.position = 'relative';
  container.style.overflow = 'hidden';
  var capaFondo = document.createElement('div');
  capaFondo.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
  capaFondo.innerHTML =
    '<div data-f="claro" style="position:absolute;inset:0;background:#e9eef2;transition:opacity .5s ease;"></div>' +
    '<div data-f="idap" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#17304f 0%,#060b1c 100%);opacity:0;transition:opacity .5s ease;"></div>';
  container.appendChild(capaFondo);
  var fondos = { claro: capaFondo.children[0], idap: capaFondo.children[1] };

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

  renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
  container.appendChild(renderer.domElement);

  var capaHTML = document.createElement('div');
  capaHTML.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden;font-family:inherit;-webkit-font-smoothing:antialiased;';

  var scene = new THREE.Scene();

  var texSombra = radial([[0, 'rgba(0,22,36,0.55)'], [0.45, 'rgba(0,22,36,0.22)'], [1, 'rgba(0,22,36,0)']]);
  function sombra(w, d, y) {
    var m = track(new THREE.MeshBasicMaterial({ map: texSombra, transparent: true, depthWrite: false }));
    var o = malla('sombra', track(new THREE.PlaneGeometry(w, d)), m);

  }

  function capa(html, w, h) {
    var el = document.createElement('div');
    el.style.cssText = 'position:absolute;left:0;top:0;width:' + w + 'px;height:' + h + 'px;transform-origin:0 0;opacity:0;';
    el.innerHTML = html;
    capaHTML.appendChild(el);
    return el;
  }
  var q = function (el, sel) { return el.querySelector('[data-r="' + sel + '"]'); };
  var qa = function (el, sel) { return Array.prototype.slice.call(el.querySelectorAll('[data-r="' + sel + '"]')); };
  var CHECK = function (c, s) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.4l2.9 2.9 6.1-6.6" stroke="' + c + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; };

  var entradas = {};
  function nuevaEntrada(nombre, fondo) {
    var root = new THREE.Group(); root.name = nombre;
    var pivot = new THREE.Group(); pivot.name = nombre + '_pivote';
    root.add(pivot); scene.add(root); root.visible = false;
    var e = { nombre: nombre, root: root, pivot: pivot, mats: [], capas: [], fondo: fondo, inicio: 0 };
    entradas[nombre] = e;
    return e;
  }

  // ============ AVISO ============
  (function () {
    var e = nuevaEntrada('aviso', 'claro'), P = e.pivot, L = e.mats;

    var mLente = mat('lente', { color: 0x0a1a24, roughness: 0.1, metalness: 0.6 }, L);

    P.add(malla('cuerpo', roundedBox(0.8, 1.62, 0.085, 0.12, 0.02), mNavy));
    var vidrio = malla('vidrio', roundedPlane(0.76, 1.58, 0.1), mVidrio); vidrio.position.z = 0.0435; P.add(vidrio);

    var texPantalla = lienzo(256, 548, function (x, w, h) {
      var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1b5676'); g.addColorStop(0.55, '#0b3450'); g.addColorStop(1, '#051f31');

    L.push({ m: mPantalla, base: 1 });
    var pantalla = malla('pantalla', roundedPlane(0.72, 1.54, 0.085), mPantalla); pantalla.position.z = 0.0445; P.add(pantalla);
    var isla = malla('isla', roundedPlane(0.2, 0.05, 0.025), mNegro); isla.position.set(0, 0.715, 0.0452); P.add(isla);

    MODOS.forEach(function (m) { var e = entradas[m]; if (e.root.visible) { var f = e.mats[0].m.opacity; e.capas.forEach(function (c) { colocar(c, f); }); } });
  }

  function limpiar() {
    cancelAnimationFrame(raf);

    recursos.forEach(function (r) { if (r && r.dispose) r.dispose(); });
